<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Emprego</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Sistema de Cadastro de Emprego</h1>
    </header>

    <main class="container">

        <h2>Cadastro de Candidato</h2>

        <form action="#" method="post">

            <label for="foto">Foto do Candidato</label>
            <input type="file" id="foto" name="foto" accept="image/*">

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>

            <label for="nascimento">Data de Nascimento</label>
            <input type="date" id="nascimento" name="nascimento" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro">

            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade">

            <label for="estado">Estado</label>
            <select id="estado" name="estado">
                <option value="">Selecione</option>
                <option>AC</option>
                <option>AL</option>
                <option>AP</option>
                <option>AM</option>
                <option>BA</option>
                <option>CE</option>
                <option>DF</option>
                <option>ES</option>
                <option>GO</option>
                <option>MA</option>
                <option>MT</option>
                <option>MS</option>
                <option>MG</option>
                <option>PA</option>
                <option>PB</option>
                <option>PR</option>
                <option>PE</option>
                <option>PI</option>
                <option>RJ</option>
                <option>RN</option>
                <option>RS</option>
                <option>RO</option>
                <option>RR</option>
                <option>SC</option>
                <option>SP</option>
                <option>SE</option>
                <option>TO</option>
            </select>

            <label for="escolaridade">Escolaridade</label>
            <select id="escolaridade" name="escolaridade">
                <option>Ensino Fundamental</option>
                <option>Ensino Médio</option>
                <option>Técnico</option>
                <option>Ensino Superior</option>
                <option>Pós-graduação</option>
            </select>

            <label for="cargo">Cargo Desejado</label>
            <input type="text" id="cargo" name="cargo">

            <label for="salario">Pretensão Salarial</label>
            <input type="number" id="salario" name="salario" placeholder="R$">

            <label for="experiencia">Experiência Profissional</label>
            <textarea id="experiencia" name="experiencia" rows="5"></textarea>

            <label for="habilidades">Habilidades</label>
            <textarea id="habilidades" name="habilidades" rows="4"></textarea>

            <label for="curriculo">Currículo (PDF)</label>
            <input type="file" id="curriculo" name="curriculo" accept=".pdf">

            <button type="submit">Cadastrar</button>

        </form>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
